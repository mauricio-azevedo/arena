# Dependabot version updates. Security updates are enabled in the repository
# settings and use the same groups and cooldown.
version: 2
updates:
  # One pnpm lockfile at the root covers every workspace package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Mirrors pnpm's minimumReleaseAge so a fresh release settles before it lands.
    cooldown:
      default-days: 7
    groups:
      # Minor and patch updates ride together; majors open one PR each.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # The @types/node major tracks the Node major, pinned in .nvmrc and
      # engines. Raise it together with those, not on its own.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the native compiler and ships no JavaScript compiler
      # API, which ts-jest, typescript-eslint and the Nest CLI all build on.
      # Raise it when that toolchain lands, not on its own (#337).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # Conventional Commits title, checked by pr-title.yml.
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: ci
