name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # `just migrate-deploy` and the e2e suite run against the service container
      DATABASE_URL: postgresql://arena:arena@localhost:5432/arena
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: pnpm install --frozen-lockfile
      - run: just migrate-deploy
      - run: just ci

  # The API image installs and builds inside Docker, so this job needs neither
  # Node nor pnpm on the runner.
  api-image:
    name: api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN pushes to GHCR; no OIDC involved
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arena-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # A pull request has nothing to deploy, so it only proves the image builds.
      - if: github.event_name == 'pull_request'
        run: just docker-build

      # main publishes what the hosts pull: `:<sha>`, the immutable tag a service pins,
      # and `:main`, which always names the newest build.
      - if: github.event_name == 'push'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          just docker-build "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
