services:
  postgres:
    image: postgres:16
    container_name: arena-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes:
      - arena-postgres-data:/var/lib/postgresql/data
    # `docker compose up --wait` returns only once this passes
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arena -d arena']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  arena-postgres-data:
